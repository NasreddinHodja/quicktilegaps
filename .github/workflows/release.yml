name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches metadata.json version
        run: |
          version=$(jq -r .KPlugin.Version metadata.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.json version $version"
            exit 1
          fi

      - name: Build package
        run: zip -r "quicktilegaps-${GITHUB_REF_NAME#v}.kwinscript" metadata.json metadata.json.license README.org contents LICENSES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" quicktilegaps-*.kwinscript --title "$GITHUB_REF_NAME" --generate-notes
